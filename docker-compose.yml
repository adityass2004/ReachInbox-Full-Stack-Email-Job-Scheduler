services:
  postgres:
    image: postgres:16-alpine
    container_name: reachinbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: reachinbox
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reachinbox"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: reachinbox-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: reachinbox-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      # Container-to-container internal communication using Docker DNS/service names
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/reachinbox
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET:-reachinbox-docker-jwt-secret-min32chars}
      SESSION_SECRET: ${SESSION_SECRET:-reachinbox-docker-session-secret-min32chars}
      MAX_EMAILS_PER_HOUR_PER_SENDER: ${MAX_EMAILS_PER_HOUR_PER_SENDER:-200}
      BULL_BOARD_ADMIN_EMAILS: ${BULL_BOARD_ADMIN_EMAILS:-*}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: http://localhost:4000/api/auth/google/callback
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_REDIRECT_URI: http://localhost:4000/api/integrations/slack/callback
      SLACK_TOKEN_ENCRYPTION_KEY: ${SLACK_TOKEN_ENCRYPTION_KEY:-}
      SLACK_NOTIFICATION_CHANNEL_ID: ${SLACK_NOTIFICATION_CHANNEL_ID:-}
      ETHEREAL_HOST: ${ETHEREAL_HOST:-smtp.ethereal.email}
      ETHEREAL_PORT: ${ETHEREAL_PORT:-587}
      ETHEREAL_USER: ${ETHEREAL_USER:-}
      ETHEREAL_PASSWORD: ${ETHEREAL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: reachinbox-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      # Container-to-container internal communication using Docker DNS/service names
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/reachinbox
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      MIN_EMAIL_DELAY_MS: ${MIN_EMAIL_DELAY_MS:-2000}
      MAX_EMAILS_PER_HOUR_PER_SENDER: ${MAX_EMAILS_PER_HOUR_PER_SENDER:-200}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_REDIRECT_URI: http://localhost:4000/api/integrations/slack/callback
      SLACK_TOKEN_ENCRYPTION_KEY: ${SLACK_TOKEN_ENCRYPTION_KEY:-}
      SLACK_NOTIFICATION_CHANNEL_ID: ${SLACK_NOTIFICATION_CHANNEL_ID:-}
      ETHEREAL_HOST: ${ETHEREAL_HOST:-smtp.ethereal.email}
      ETHEREAL_PORT: ${ETHEREAL_PORT:-587}
      ETHEREAL_USER: ${ETHEREAL_USER:-}
      ETHEREAL_PASSWORD: ${ETHEREAL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Browser-facing externally reachable API URL (never internal http://api:4000)
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: reachinbox-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api

volumes:
  pg_data:
  redis_data:
  es_data:
